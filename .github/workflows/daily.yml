name: daily
on:
  schedule:
    # Every 3 hours, every day: the favourites paper tests need entries before game start / within their windows.
    # The scorecard step runs only from 15:23 UTC on (~10:23 ET); the later runs are backups (GitHub cron is
    # best-effort) and scorecard_state.json keeps it to one post per New York day.
    - cron: "23 */3 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily  # separate from 'monitor': the long market-hours loop must not block this
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Sports paper bets
        continue-on-error: true
        run: |
          if [ -f sports.py ]; then python -c "import sports; sports.run_daily()"; else echo "no sports.py yet"; fi
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      - name: Paper test tennis_favorites (public Polymarket data, no secrets, never orders)
        continue-on-error: true
        working-directory: betting
        env:
          SPORTS_DB_PATH: ${{ github.workspace }}/betting/paper_favorites.sqlite3
        run: python tennis_favorites.py
      - name: Paper test sport_favorites (public Polymarket data, no secrets, never orders)
        continue-on-error: true
        working-directory: betting
        env:
          SPORTS_DB_PATH: ${{ github.workspace }}/betting/paper_favorites.sqlite3
        run: python sport_favorites.py
      - name: Paper test any_favorites (public Polymarket data, no secrets, never orders)
        continue-on-error: true
        working-directory: betting
        env:
          SPORTS_DB_PATH: ${{ github.workspace }}/betting/paper_favorites.sqlite3
        run: python any_favorites.py
      - name: Scorecard
        run: |
          if [ "$(date -u +%H)" -ge 15 ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python scorecard.py
          else
            echo "scorecard runs from 15 UTC (one post per New York day)"
          fi
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_OPT_API_KEY: ${{ secrets.ALPACA_OPT_API_KEY }}
          ALPACA_OPT_SECRET_KEY: ${{ secrets.ALPACA_OPT_SECRET_KEY }}
      - name: Save state
        if: ${{ always() }}
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add signals/ 2>/dev/null || true
          git add scorecard_state.json 2>/dev/null || true  # separate add: a missing file would abort the one above
          git add betting/paper_favorites.sqlite3 2>/dev/null || true
          # the monitor job may have pushed meanwhile: rebase onto it, keeping this run's files on conflict
          git diff --cached --quiet || (git commit -m "daily state" && git pull --rebase -X theirs && git push)
