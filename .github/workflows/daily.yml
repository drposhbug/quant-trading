name: daily
on:
  schedule:
    # Every day incl. weekends, off-peak. 14:23 UTC posts the scorecard (~09:23 ET); 02:23 UTC is the backup if that
    # run was dropped (GitHub cron is best-effort). scorecard_state.json keeps it to one post per New York day.
    - cron: "23 2,14 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily  # separate from 'monitor': the long market-hours loop must not block this
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Sports paper bets
        continue-on-error: true
        run: |
          if [ -f sports.py ]; then python -c "import sports; sports.run_daily()"; else echo "no sports.py yet"; fi
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      - name: Scorecard
        run: python scorecard.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_OPT_API_KEY: ${{ secrets.ALPACA_OPT_API_KEY }}
          ALPACA_OPT_SECRET_KEY: ${{ secrets.ALPACA_OPT_SECRET_KEY }}
      - name: Save state
        if: ${{ always() }}
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add signals/ 2>/dev/null || true
          git add scorecard_state.json 2>/dev/null || true  # separate add: a missing file would abort the one above
          # the monitor job may have pushed meanwhile: rebase onto it, keeping this run's files on conflict
          git diff --cached --quiet || (git commit -m "daily state" && git pull --rebase -X theirs && git push)
