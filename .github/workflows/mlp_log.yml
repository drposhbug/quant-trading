name: mlp-log
on:
  schedule:
    # The network's forward record: one dated forecast per stock after each close, scored 21 sessions later
    # (mlp_odds.py --log), the pattern-finder's, and the daily calls on about 500 stocks (daily_calls.py).
    # 22:10 UTC is after the New York close in winter and summer; 23:40 backs it up
    # (GitHub cron is best-effort). A second run on the same day adds nothing.
    - cron: "10 22 * * 1-5"
    - cron: "40 23 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mlp-log
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Forward record (reads public prices, never orders, posts nothing)
        run: python mlp_odds.py --log --refresh
      - name: Pattern-finder's forward record (discover_odds.py; same prices, never orders, posts nothing)
        continue-on-error: true  # a failure here must not lose the network's rows
        run: python discover_odds.py --log
      - name: Profitability from SEC filings, refreshed on Fridays (fundamentals_data.py; public data, no key)
        continue-on-error: true
        run: |
          if [ "$(date -u +%u)" = "5" ]; then python fundamentals_data.py; else echo "refreshed on Fridays"; fi
      - name: Daily calls on the S&P 500 by date (daily_calls.py; reads prices with the Alpaca data key, has no order code, posts nothing)
        continue-on-error: true
        run: python daily_calls.py
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      - name: Candidate versions of the bot, in shadow (shadow_book.py; reads prices, has no order code, posts nothing)
        continue-on-error: true
        run: python shadow_book.py
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      - name: Save
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add signals/mlp_forecasts.csv 2>/dev/null || true
          git add signals/mlp_forward.csv 2>/dev/null || true  # separate add: a file that does not exist yet would abort the one above
          git add signals/discover_forecasts.csv 2>/dev/null || true
          git add signals/discover_forward.csv 2>/dev/null || true
          git add signals/discover_found.csv 2>/dev/null || true
          git add signals/calls.csv 2>/dev/null || true
          git add signals/calls_scored.csv 2>/dev/null || true
          git add signals/calls_beliefs.csv 2>/dev/null || true
          git add signals/calls_probs.csv 2>/dev/null || true
          git add signals/calls_probs_scored.csv 2>/dev/null || true
          git add signals/calls_past.csv 2>/dev/null || true
          git add signals/calls_standouts.csv 2>/dev/null || true
          git add reports/daily_calls.md 2>/dev/null || true
          git add lab/fundamentals.csv 2>/dev/null || true
          git add reports/shadow_versions.md 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "network forward record" && git pull --rebase -X theirs && git push)
