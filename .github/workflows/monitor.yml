name: monitor
on:
  schedule:
    # Hourly starts at :17 (off the busy top of the hour), 12:17-20:17 UTC Mon-Fri. GitHub cron is best-effort
    # (2026-11-19: no run fired during market hours), so whichever start fires first runs loop_monitor.py, which keeps
    # passing every 2-5 min until the close. Later starts queue behind it (concurrency) and exit fast after the close.
    - cron: "17 12-20 * * 1-5"
    # Off-hours news watch (added 2026-11-23): the Huang rehire news broke while no run was scheduled (last pass Sat
    # 19:34 ET, Trump's "rehire Jensen" post Sun 21:54 ET, NVDA +33% at Mon open). Off-hours a pass only snapshots
    # prediction markets and sends news alerts; it never trades. Public repo, so these minutes are free.
    - cron: "47 * * * 0,6"      # weekends, hourly
    - cron: "47 0-11 * * 1-5"   # weekday nights / pre-market, hourly until the 12:17 market-day start
  workflow_dispatch:
    inputs:
      force:
        description: "Run even if the market is closed (sends summary + rebalances)"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: monitor
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Monitor loop (until the close)
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          python loop_monitor.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_OPT_API_KEY: ${{ secrets.ALPACA_OPT_API_KEY }}
          ALPACA_OPT_SECRET_KEY: ${{ secrets.ALPACA_OPT_SECRET_KEY }}
          FORCE: ${{ inputs.force && '1' || '0' }}
      - name: Save state
        if: ${{ always() }}  # a failed monitor run must still commit state, or alerts/rebalance repeat
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add state.json signals/ 2>/dev/null || true
          git add options_state.json 2>/dev/null || true  # separate add: a missing file would abort the one above
          # a queued run checked out an older commit: rebase onto the newest state, keeping this run's files on conflict
          git diff --cached --quiet || (git commit -m "monitor state" && git pull --rebase -X theirs && git push)
