name: monitor
on:
  schedule:
    # Every 5 min (GitHub's minimum), 13:30-21:00 UTC Mon-Fri: covers 9:30-16:00 New York in both EST and EDT. monitor.py checks the real market clock.
    # Public repo, so Actions minutes are free. If made private again, drop to every 10 min (2,000 free min/month).
    - cron: "30-59/5 13 * * 1-5"
    - cron: "*/5 14-20 * * 1-5"
    - cron: "0 21 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Run even if the market is closed (sends summary + rebalances)"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: monitor
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python monitor.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          FORCE: ${{ inputs.force && '1' || '0' }}
      - name: Save state
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add state.json signals/ 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "monitor state" && git push)
